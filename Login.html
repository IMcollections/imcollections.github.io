<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | IM Collections</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      min-height: 100vh;
    }

    .topbar {
      background: #050505;
      color: white;
      text-align: center;
      padding: 11px 15px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .back-home {
      position: absolute;
      left: 20px;
      color: #111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .page-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 45px 20px 60px;
    }

    .login-card {
      background: white;
      border-radius: 14px;
      padding: 35px 25px;
      box-shadow: 0 7px 30px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      font-family: Georgia, serif;
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #c9962e;
    }

    .login-btn {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 8px;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      background: #e9f7ec;
      color: #176c2d;
      border: 1px solid #b7dfc0;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a12020;
      border: 1px solid #efbcbc;
    }

    .register-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #666;
    }

    .register-text a {
      color: #111;
      font-weight: 700;
    }

    .forgot {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 16px;
    }

    .forgot a {
      color: #666;
      font-size: 12px;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 25px 15px;
    }

    @media (max-width: 520px) {
      .page-wrap {
        padding: 25px 14px 45px;
      }

      .login-card {
        padding: 28px 18px;
      }

      .login-card h1 {
        font-size: 28px;
      }

      .back-home {
        font-size: 12px;
        left: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    IM COLLECTIONS • WELCOME BACK
  </div>

  <header>
    <a href="index.html" class="back-home">← Shop</a>

    <a href="index.html">
      <img
        src="IM-logo.jpg"
        alt="IM Collections"
        class="logo"
      >
    </a>
  </header>

  <main class="page-wrap">

    <div class="login-card">

      <h1>Login</h1>

      <p class="subtitle">
        Sign in to your IM Collections account.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="forgot">
          <a href="#">
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Login To My Account
        </button>

        <div
          id="loginMessage"
          class="message"
        ></div>

      </form>

      <div class="register-text">
        Don't have an account?
        <a href="Register.html">Register</a>
      </div>

    </div>

  </main>

  <footer>
    © 2026 IM Collections. All Rights Reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl =
      "https://vqzjegneplzeoqxcqfeu.supabase.co";

    const supabaseKey =
      "sb_publishable_QDvKrAHvvopp_fuunxTxEA_4v6TD4Jk";

    const supabaseClient =
      supabase.createClient(
        supabaseUrl,
        supabaseKey
      );

    const loginForm =
      document.getElementById("loginForm");

    const loginMessage =
      document.getElementById("loginMessage");

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;

        loginMessage.className =
          "message";

        loginMessage.textContent = "";

        const { data, error } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });

        if (error) {
          loginMessage.className =
            "message error";

          loginMessage.textContent =
            error.message;

          return;
        }

        loginMessage.className =
          "message success";

        loginMessage.textContent =
          "Login successful! Redirecting...";

        setTimeout(() => {
          window.location.href =
            "index.html";
        }, 800);
      }
    );
  </script>

</body>
</html>

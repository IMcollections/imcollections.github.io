<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IM Collections Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 20px;
    }

    .admin-wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .admin-header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .admin-header p {
      color: #666;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .drop-zone {
      border: 2px dashed #999;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
    }

    .drop-zone.dragover {
      border-color: #111;
      background: #eee;
    }

    .drop-zone strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .drop-zone span {
      color: #777;
      font-size: 14px;
    }

    #imageInput {
      display: none;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .preview-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox-row input {
      width: auto;
    }

    .save-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: 700;
      line-height: 1.4;
    }

    .success {
      color: #138a36;
    }

    .error {
      color: #c62828;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .preview-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="admin-wrap">

  <div class="admin-header">
    <h1>IM Collections</h1>
    <p>Product Admin</p>
  </div>

  <div class="card">

    <h2 style="margin-bottom:15px;">Add Product</h2>

    <div class="drop-zone" id="dropZone">
      <strong>Drag & Drop Product Photos Here</strong>
      <span>or tap here to choose photos from your phone</span>
    </div>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    />

    <div class="preview-grid" id="previewGrid"></div>

  </div>

  <div class="card">

    <div class="form-grid">

      <div class="full">
        <label>Product Name</label>
        <input
          type="text"
          id="productName"
          placeholder="Example: Coach Leather Handbag"
        />
      </div>

      <div>
        <label>Price</label>
        <input
          type="number"
          id="price"
          placeholder="49.99"
          step="0.01"
        />
      </div>

      <div>
        <label>Old Price / Original Price</label>
        <input
          type="number"
          id="oldPrice"
          placeholder="79.99"
          step="0.01"
        />
      </div>

      <div>
        <label>Category</label>

        <select id="category">
          <option value="">Select Category</option>
          <option value="Bags">Bags</option>
          <option value="Watches">Watches</option>
          <option value="Shoes">Shoes</option>
          <option value="Clothing">Clothing</option>
          <option value="Apparel">Apparel</option>
          <option value="Electronics">Gadgets / Electronics</option>
          <option value="Accessories">Accessories</option>
          <option value="Toys">Toys</option>
        </select>
      </div>

      <div>
        <label>Size</label>
        <input
          type="text"
          id="size"
          placeholder="Example: M, XL, 9.5"
        />
      </div>

      <div>
        <label>Condition</label>

        <select id="condition">
          <option value="">Select Condition</option>
          <option value="New">New</option>
          <option value="Like New">Like New</option>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Pre-Owned">Pre-Owned</option>
        </select>
      </div>

      <div>
        <label>Quantity</label>
        <input
          type="number"
          id="quantity"
          value="1"
          min="0"
        />
      </div>

      <div>
        <label>Badge</label>

        <select id="badge">
          <option value="">No Badge</option>
          <option value="New">New</option>
          <option value="Sale">Sale</option>
          <option value="Limited">Limited</option>
          <option value="Best Seller">Best Seller</option>
        </select>
      </div>

      <div class="full">
        <label>Description</label>

        <textarea
          id="description"
          placeholder="Describe your product..."
        ></textarea>
      </div>

      <div class="full checkbox-row">

        <input
          type="checkbox"
          id="featured"
        />

        <label for="featured" style="margin:0;">
          Featured Product
        </label>

      </div>

    </div>

    <button class="save-btn" id="saveProduct">
      Save Product
    </button>

    <div class="message" id="message"></div>

  </div>

</div>
<!-- =========================================
     MANAGE PRODUCTS
========================================= -->

<div class="admin-wrap">
  <div class="card">
    <h2 style="margin-bottom:15px;">Manage Products</h2>

    <p style="margin-bottom:15px; color:#666;">
      Edit product information or delete products.
    </p>

    <div id="productsList">
      Loading products...
    </div>
  </div>
</div>
<script>

const SUPABASE_URL =
  "https://vqzjegneplzeoqxcqfeu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QDvKrAHvvopp_fuunxTxEA_4v6TD4Jk";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const dropZone =
  document.getElementById("dropZone");

const imageInput =
  document.getElementById("imageInput");

const previewGrid =
  document.getElementById("previewGrid");

const saveButton =
  document.getElementById("saveProduct");

const message =
  document.getElementById("message");

let selectedImages = [];


/* =========================
   IMAGE SELECT
========================= */

dropZone.addEventListener("click", () => {
  imageInput.click();
});

imageInput.addEventListener("change", event => {
  handleFiles(event.target.files);
});

dropZone.addEventListener("dragover", event => {
  event.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", event => {

  event.preventDefault();

  dropZone.classList.remove("dragover");

  handleFiles(event.dataTransfer.files);

});


function handleFiles(files) {

  const incoming =
    Array.from(files)
      .filter(file =>
        file.type.startsWith("image/")
      );

  selectedImages = incoming;

  previewGrid.innerHTML = "";

  selectedImages.forEach(file => {

    const reader = new FileReader();

    reader.onload = event => {

      const img =
        document.createElement("img");

      img.src = event.target.result;

      previewGrid.appendChild(img);

    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(file) {

  const extension =
    file.name.split(".").pop() || "jpg";

  const safeExtension =
    extension.toLowerCase();

  const fileName =
    `${Date.now()}-${crypto.randomUUID()}.${safeExtension}`;

  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        fileName,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );

  if (uploadError) {
    throw uploadError;
  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(fileName);

  return data.publicUrl;

}


/* =========================
   SAVE PRODUCT
========================= */

saveButton.addEventListener(
  "click",
  async () => {

    message.className = "message";
    message.textContent = "";

    const name =
      document
        .getElementById("productName")
        .value
        .trim();

    const priceValue =
      document
        .getElementById("price")
        .value;

    const oldPriceValue =
      document
        .getElementById("oldPrice")
        .value;

    const category =
      document
        .getElementById("category")
        .value;

    const size =
      document
        .getElementById("size")
        .value
        .trim();

    const condition =
      document
        .getElementById("condition")
        .value;

    const quantity =
      Number(
        document
          .getElementById("quantity")
          .value || 1
      );

    const badge =
      document
        .getElementById("badge")
        .value;

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const featured =
      document
        .getElementById("featured")
        .checked;


    if (!name) {
      showError("Please enter a product name.");
      return;
    }

    if (!priceValue) {
      showError("Please enter a price.");
      return;
    }

    if (!category) {
      showError("Please select a category.");
      return;
    }

    if (selectedImages.length === 0) {
      showError(
        "Please choose at least one product photo."
      );
      return;
    }


    saveButton.disabled = true;

    saveButton.textContent =
      "Uploading photos...";

    message.textContent =
      "Please wait while your product is uploaded.";


    try {

      const imageUrls = [];


      for (
        const imageFile of selectedImages
      ) {

        const publicUrl =
          await uploadImage(imageFile);

        imageUrls.push(publicUrl);

      }


      saveButton.textContent =
        "Saving product...";


      const productData = {

        name: name,

        price: Number(priceValue),

        old_price:
          oldPriceValue
            ? Number(oldPriceValue)
            : null,

        category: category,

        size:
          size || null,

        condition:
          condition || null,

        quantity: quantity,

        badge:
          badge || null,

        description:
          description || null,

        featured: featured,

        image_urls: imageUrls

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .insert([productData])
          .select();


      if (error) {
        throw error;
      }


      console.log(
        "Product saved:",
        data
      );


      message.className =
        "message success";

      message.textContent =
        "✅ Product uploaded successfully!";


      resetForm();


    } catch (error) {

      console.error(error);

      message.className =
        "message error";

      message.textContent =
        "❌ " +
        (
          error.message ||
          "Something went wrong."
        );

    } finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "Save Product";

    }

  }
);


/* =========================
   RESET
========================= */

function resetForm() {

  document
    .getElementById("productName")
    .value = "";

  document
    .getElementById("price")
    .value = "";

  document
    .getElementById("oldPrice")
    .value = "";

  document
    .getElementById("category")
    .value = "";

  document
    .getElementById("size")
    .value = "";

  document
    .getElementById("condition")
    .value = "";

  document
    .getElementById("quantity")
    .value = "1";

  document
    .getElementById("badge")
    .value = "";

  document
    .getElementById("description")
    .value = "";

  document
    .getElementById("featured")
    .checked = false;

  imageInput.value = "";

  selectedImages = [];

  previewGrid.innerHTML = "";

}


function showError(text) {

  message.className =
    "message error";

  message.textContent = text;

}
/* =========================
   MANAGE PRODUCTS
========================= */

const productsList =
  document.getElementById("productsList");


  async function loadProducts() {
  productsList.innerHTML = "Loading products...";

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    productsList.innerHTML = "Could not load products.";
    console.error(error);
    return;
  }

  console.log("Products:", data);

   if (!data || data.length === 0) {
  productsList.innerHTML = "No products found.";
  return;
}

productsList.innerHTML = data.map(product => `
  <div class="product-admin-item">
    <strong>${product.name || "Unnamed Product"}</strong><br>
    <span>$${product.price || "0.00"}</span><br><br>

    <button type="button" onclick="editProduct(${product.id})">
      Edit
    </button>

    <button type="button" onclick="deleteProduct(${product.id})">
      Delete
    </button>
  </div>
`).join("");
}

 async function deleteProduct(id) {
  const confirmed = confirm("Are you sure you want to delete this product?");

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete product.");
    console.error(error);
    return;
  }

  alert("Product deleted.");
  loadProducts();
} 
  loadProducts();
</script>

</body>
</html>

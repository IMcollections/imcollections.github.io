<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | IM Collections</title>

  <!-- Secure Shopify Shop Pay SDK Script Core Integration -->
  <script src="https://shopify.com" async></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .checkout-header {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 14px 20px;
      letter-spacing: 2px;
      font-size: 13px;
    }

    .logo-area {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .back-link {
      color: #111;
      text-decoration: none;
      font-weight: 700;
    }

    .checkout-container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 18px 40px;
    }

    .checkout-title {
      font-family: Georgia, serif;
      font-size: 34px;
      margin-bottom: 22px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
    }

    .checkout-box {
      background: #fff;
      border: 1px solid #e2e2e2;
      padding: 22px;
      margin-bottom: 20px;
    }

    .checkout-box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .order-item {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr) auto;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      align-items: start;
    }

    .order-item img {
      width: 132px;
      height: 156px;
      object-fit: contain;
      background: #fff;
    }
    .order-product-details { min-width: 0; }
    .order-name, .order-quantity, .order-price { overflow-wrap: anywhere; }

    .order-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .order-quantity {
      color: #777;
      font-size: 13px;
    }

    .order-price {
      font-weight: 700;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #ddd;
      margin-top: 12px;
      padding-top: 16px;
      font-size: 20px;
      font-weight: 800;
    }

    .free-shipping {
      margin-top: 12px;
      padding: 12px;
      background: #f4f4f4;
      font-weight: 700;
    }

    .discount-row {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      width: 100%;
      box-sizing: border-box;
    }

    .discount-row input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      font-size: 15px;
      min-width: 0;
    }

    .discount-row button {
      border: 0;
      background: #222;
      color: #fff;
      padding: 0 18px;
      font-weight: 700;
      font-size: 15px;
      min-width: 96px;
      flex-shrink: 0;
    }

    .payment-box {
      margin-top: 18px;
    }

    .payment-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      background: #111;
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 15px;
    }

    .secure-note {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    #checkoutMessage {
      margin-top: 12px;
      font-size: 14px;
    }

    @media (max-width: 720px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }

      .checkout-title {
        font-size: 30px;
      }
    }

    #guestCountry {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #bbb;
      background: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }

    .order-summary-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 0 0 20px;
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: #111;
      text-align: left;
      cursor: pointer;
    }

    #orderSummaryArrow,
    #bottomSummaryArrow {
      font-size: 18px;
      line-height: 1;
      margin-left: 12px;
    }

    .summary-thumbnails {
      display: flex;
      flex-wrap: nowrap;
      gap: 14px;
      margin: 0 0 24px;
      padding: 4px 4px 14px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .summary-thumbnails[hidden] { display: none; }
    
    input[type="checkbox"] {
      width: 18px !important;
      height: 18px !important;
      min-width: 18px;
      padding: 0 !important;
      margin: 0 8px 0 0;
      vertical-align: middle;
    }

    .guest-form {
      display: grid;
      gap: 8px;
    }

    .guest-form label {
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
    }

    .guest-form input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #ccc;
      padding: 12px;
      font-size: 15px;
      background: #fff;
    }

    .shipping-method-box {
      margin-bottom: 28px;
    }

    .shipping-option {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px;
      border: 1px solid #cccccc;
      box-sizing: border-box;
      cursor: pointer;
    }

    .shipping-option-text {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .shipping-option-text strong { font-size: 17px; }
    .shipping-option-text small { font-size: 14px; color: #666; margin-top: 3px; }
    .shipping-option-price { font-size: 17px; font-weight: 600; white-space: nowrap; }

    .payment-method-options {
      display: flex;
      flex-direction: column;
    }

    .payment-method-option {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      margin: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .payment-method-option + .payment-method-option {
      border-top: none;
    }

    .payment-method-option input[type="radio"] {
      width: 20px;
      height: 20px;
      margin: 0;
    }

    .payment-method-option span {
      font-size: 16px;
      font-weight: 600;
    }

    .payment-method-options > .payment-method-option:has(input:checked) { 
      border-color: #b78e36 !important; 
      background: #faf6ec; 
    }
  </style>
</head>
<body>

  <div class="checkout-header">
    IM COLLECTIONS • SECURE CHECKOUT
  </div>

  <div class="logo-area">
    <a href="https://github.io" class="back-link"><h2>← Continue Shopping</h2></a>
    <a href="https://github.io"><img src="IM-logo.jpg" alt="IM Collections"></a>
  </div>

  <main class="checkout-container">
    <div class="checkout-grid">
      <section>
        <button type="button" class="order-summary-toggle" id="orderSummaryToggle">
          <span>Order Summary</span>
          <span id="checkoutTotal">$0.00</span>
        </button>

        <h2>Delivery Information</h2>
        <div class="guest-form">
          <label for="guestCountry">Country / Region</label>
          <select id="guestCountry">
            <option value="United States">United States</option>
          </select>

          <label>Street Address</label>
          <input type="text" placeholder="Address">
          <label>ZIP Code</label>
          <input type="text" id="guestZip" placeholder="ZIP Code">
        </div>

        <section class="shipping-method-box" style="margin-top:24px;">
          <h2>USPS Shipping Method</h2>
          <label class="shipping-option">
            <input type="radio" checked disabled>
            <span class="shipping-option-text"><strong>USPS Standard Shipping</strong><small>3–5 days</small></span>
            <span class="shipping-option-price">$8.99</span>
          </label>
        </section>

        <h2>Payment</h2>
        <div class="payment-method-options">
          <label class="payment-method-option">
            <input type="radio" name="paymentMethod" value="card" id="paymentMethodCard" checked>
            <span>Credit / Debit Card</span>
          </label>

          <label class="payment-method-option">
            <input type="radio" name="paymentMethod" value="shoppay" id="paymentMethodShopPay">
            <span>Shop Pay</span>
          </label>

          <label class="payment-method-option">
            <input type="radio" name="paymentMethod" value="cashapp" id="paymentMethodCashApp">
            <span>Cash App Pay</span>
          </label>
        </div>

        <!-- Shop Pay Interface Button Slot Container -->
        <div id="shopPayPaymentSection" style="display: none; margin: 18px 0 28px;">
          <div id="shop-pay-button-container"></div>
        </div>

        <div id="cardPaymentSection">
          <div id="card-container" style="border: 1px solid #ccc; padding: 12px; margin-top: 12px;"></div>
        </div>

        <button type="button" class="payment-button" id="paymentButton">Pay Now</button>
      </section>
    </div>
  </main>

  <script src="https://squarecdn.com"></script>
  
  <script>
    const squareAppId = "sandbox-sq0idb-c7snyR_ZJ25r9nRUu7ZvqA";
    const squareLocationId = "LG5NFQWF";

    async function initializeCheckout() {
      if (!window.Square) return;
      const payments = Square.payments(squareAppId, squareLocationId);
      
      try {
        const card = await payments.card();

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | IM Collections</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .reset-header {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 18px;
      letter-spacing: 2px;
    }

    .reset-container {
      max-width: 620px;
      margin: 35px auto;
      padding: 20px;
    }

    .reset-card {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #resetMessage {
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
    }

    .success {
      color: #2e7d32;
    }

    .error {
      color: #b71c1c;
    }
  </style>
</head>

<body>

  <div class="reset-header">
    IM COLLECTIONS
  </div>

  <main class="reset-container">
    <div class="reset-card">

      <h1>Reset Password</h1>

      <p class="subtitle">
        Enter your new password below.
      </p>

      <form id="resetForm">

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            minlength="8"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
          >
        </div>

        <button type="submit">
          Update Password
        </button>

        <div id="resetMessage"></div>

      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl =
      "https://vqzjegneplzeoqxcqfeu.supabase.co";

    const supabaseKey =
      "sb_publishable_QDvKrAHvvopp_fuunxTxEA_4v6TD4Jk";

    const supabaseClient =
      supabase.createClient(
        supabaseUrl,
        supabaseKey
      );

    const resetForm =
      document.getElementById("resetForm");

    const resetMessage =
      document.getElementById("resetMessage");

    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const newPassword =
          document.getElementById("newPassword").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
          resetMessage.className = "error";
          resetMessage.textContent =
            "Passwords do not match.";
          return;
        }

        const { error } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });

        if (error) {
          resetMessage.className = "error";
          resetMessage.textContent = error.message;
          return;
        }

        resetMessage.className = "success";
        resetMessage.textContent =
          "Password updated successfully. Redirecting to login...";

        setTimeout(() => {
          window.location.href = "Login.html";
        }, 1800);
      }
    );
  </script>

</body>
</html>

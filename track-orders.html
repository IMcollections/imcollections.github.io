<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track Orders &amp; Returns | IM Collections</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f7f6f2;
        color: #171717;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      .topbar {
        background: #111;
        color: #d4af55;
        text-align: center;
        padding: 10px;
        font-size: 12px;
        letter-spacing: 2px;
      }

      header {
        background: #fff;
        border-bottom: 1px solid #dedbd2;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      header img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      nav {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      a,
      h1,
      h2,
      h3,
      label,
      summary {
        color: #8a651f;
      }

      main {
        max-width: 900px;
        margin: 36px auto;
        padding: 0 20px;
      }

      h1 {
        margin-bottom: 8px;
      }
      h2 {
        font-size: 21px;
        margin-top: 0;
      }
      h3 {
        margin: 0;
      }

      .card {
        background: #fff;
        border: 1px solid #dedbd2;
        border-radius: 12px;
        padding: 24px;
        margin: 20px 0;
      }

      .login-card {
        max-width: 440px;
        margin: 24px auto;
      }

      label {
        display: block;
        margin: 14px 0 6px;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: #fff;
        color: #171717;
      }

      input::placeholder {
        color: #8a651f;
        opacity: 1;
      }

      select {
        color: #8a651f;
      }

      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 6px;
        background: #c9a44c;
        color: #111;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .login-card button {
        width: 100%;
        margin-top: 20px;
      }

      .section-head,
      .order-head,
      .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .section-head,
      .order-head {
        flex-wrap: wrap;
      }

      .explore {
        display: inline-block;
        border: 1px solid #b08b38;
        border-radius: 6px;
        padding: 10px 16px;
        text-decoration: none;
        background: #fff;
      }

      .greeting {
        font-size: 22px;
        color: #8a651f;
      }

      .filters,
      .return-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .filters {
        margin: 24px 0;
      }

      .badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 13px;
        background: #f8edcf;
        color: #705310;
      }

      .badge.completed {
        background: #e1f1e7;
        color: #216437;
      }

      .badge.cancelled {
        background: #f8e4e4;
        color: #8c2727;
      }

      .order-reference,
      .message {
        overflow-wrap: anywhere;
      }

      details {
        margin-top: 18px;
      }

      summary {
        cursor: pointer;
        font-weight: bold;
        padding: 8px 0;
      }

      .item {
        display: flex;
        gap: 14px;
        padding: 15px 0;
        border-bottom: 1px solid #eee;
      }

      .item img {
        width: 64px;
        height: 72px;
        object-fit: contain;
        background: #f6f6f6;
      }

      .item-copy {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .item p {
        margin: 3px 0;
      }

      .totals {
        max-width: 360px;
        margin: 20px 0 20px auto;
      }

      .summary-row {
        margin: 8px 0;
      }

      .total {
        font-weight: bold;
        border-top: 1px solid #ddd;
        padding-top: 10px;
      }

      .shipping {
        padding: 16px;
        background: #f7f6f2;
        border-radius: 6px;
        margin: 20px 0;
      }

      .shipping p {
        margin: 6px 0;
        overflow-wrap: anywhere;
      }

      .muted {
        color: #626262;
      }

      .message {
        min-height: 24px;
      }

      .error {
        color: #a42626;
      }
      .success {
        color: #216437;
      }
      .return-note {
        font-size: 14px;
      }

      footer {
        text-align: center;
        color: #666;
        padding: 30px 20px;
        font-size: 13px;
      }

      [hidden] {
        display: none !important;
      }

      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid #c9a44c;
        outline-offset: 3px;
      }

      .filters label {
        color: #8a651f;
      }
      .explore,
      #returnButton {
        display: inline-block;
        padding: 12px 18px;
        border: 0;
        border-radius: 6px;
        background: #c9a44c;
        color: #111;
        font: inherit;
        line-height: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .empty-orders {
        text-align: center;
        padding: 32px 24px;
      }
      .empty-orders p {
        margin: 0 0 18px;
      }
      .order-head h2 {
        margin-bottom: 0;
      }
      .order-card > p {
        margin: 12px 0;
      }
      .order-card details h3 {
        margin: 12px 0;
      }
      @media (max-width: 540px) {
        header {
          padding: 12px 16px;
        }
        header img {
          width: 55px;
          height: 55px;
        }
        main {
          margin-top: 24px;
          padding: 0 16px;
        }
        .card {
          padding: 18px;
        }
        .item {
          gap: 10px;
        }
        .item img {
          width: 48px;
          height: 60px;
        }
        h1 {
          font-size: 28px;
        }
        .filters,
        .return-inputs {
          grid-template-columns: 1fr;
          gap: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="topbar">IM COLLECTIONS</div>

    <header>
      <nav aria-label="Account navigation">
        <a href="index.html">Back to Shop</a>
        <a href="my-account.html">My Account</a>
      </nav>

      <a href="index.html">
        <img src="IM-logo.jpg" alt="IM Collections" />
      </a>
    </header>

    <main>
      <p id="pageMessage" class="message" role="status">
        Checking your account…
      </p>
      <section class="card" aria-labelledby="trackHeading">
        <details class="im-member-nav" data-member-only hidden>
          <summary>My Account</summary>
          <nav data-member-links></nav>
        </details>

        <span id="trackHeading" hidden>Track Orders</span>
        <form id="trackForm">
          <div class="return-inputs">
            <div>
              <label for="trackOrderNumber">Order Number</label>
              <input
                id="trackOrderNumber"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="Order Number"
                required
              />
            </div>
            <div>
              <label for="trackIdentifier">Tracking Number</label>
              <input
                id="trackIdentifier"
                type="text"
                autocomplete="off"
                maxlength="80"
                placeholder="Tracking Number"
                required
              />
            </div>
          </div>
          <div class="actions" style="margin-top: 20px">
            <button id="trackButton" class="gold" type="submit">
              Track Orders &amp; Returns
            </button>
          </div>
        </form>
        <p
          id="trackMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section id="loginCard" class="card login-card" hidden>
        <h2>Sign in to view your orders</h2>

        <form id="loginForm">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Email address"
            required
          />

          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          />

          <button id="loginButton" type="submit">Sign In</button>
        </form>

        <p id="loginMessage" class="message" role="status"></p>

        <p>
          Not a member?
          <a href="Register.html">Register</a>
        </p>

        <p>
          <a href="my-account.html">Forgot your password?</a>
        </p>
      </section>

      <section
        id="trackingResult"
        class="card"
        hidden
        aria-live="polite"
      ></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const client = supabase.createClient(
        "https://vqzjegneplzeoqxcqfeu.supabase.co",
        "sb_publishable_QDvKrAHvvopp_fuunxTxEA_4v6TD4Jk",
      );

      const byId = (id) => document.getElementById(id);

      let user = null,
        generation = 0;
      function message(id, text, failed = false) {
        byId(id).textContent = text;
        byId(id).className = "message " + (failed ? "error" : "success");
      }
      function clearResult() {
        byId("trackingResult").hidden = true;
        byId("trackingResult").replaceChildren();
      }
      function line(label, value) {
        const p = document.createElement("p");
        p.textContent = label + ": " + value;
        byId("trackingResult").append(p);
      }
      async function account() {
        const { data, error } = await client.auth.getUser();
        user = error ? null : data.user;
        byId("loginCard").hidden = !!user;
        message(
          "pageMessage",
          user
            ? "Enter your order number and the Tracking Number."
            : "Sign in with the email used at checkout to track your orders and returns.",
        );
      }
      byId("trackForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearResult();
        const run = ++generation;
        const number = byId("trackOrderNumber").value.trim(),
          identifier = byId("trackIdentifier").value.trim();
        if (
          !/^\d{10}$/.test(number) ||
          !byId("trackIdentifier").checkValidity()
        )
          return message(
            "trackMessage",
            "Enter a 10-digit order number and your Tracking Number.",
            true,
          );
        if (!user) {
          message(
            "trackMessage",
            "Sign in below, then tap Track Orders & Returns again.",
          );
          return;
        }
        byId("trackButton").disabled = true;
        message("trackMessage", "Looking up your order…");
        try {
          const { data: order, error } = await client.rpc(
            "im_track_member_order_by_identifier",
            { p_order_number: number, p_identifier: identifier },
          );
          if (run !== generation) return;
          if (error)
            throw new Error("Unable to load tracking. Please try again.");
          if (!order)
            return message(
              "trackMessage",
              "No matching order was found in this account. Check your order number and Tracking Number.",
              true,
            );
          const { data: requests, error: returnError } = await client
            .from("return_requests")
            .select("status,created_at")
            .eq("user_id", user.id)
            .eq("order_id", order.id)
            .order("created_at", { ascending: false });
          if (run !== generation) return;
          byId("trackingResult").hidden = false;
          line("Order Number", order.order_number);
          line(
            "Order Status",
            order.status === "completed"
              ? "Completed (Shipped)"
              : order.status === "cancelled"
                ? "Cancelled"
                : "Pending",
          );
          line("Carrier", order.carrier || "Not added yet");
          line(
            "Tracking Number",
            order.tracking_number || "Available when your shipment is prepared",
          );
          if (order.shipped_at)
            line("Shipped", new Date(order.shipped_at).toLocaleDateString());
          line(
            "Return Status",
            returnError
              ? "Unable to load return status. Please try again."
              : requests?.length
                ? requests[0].status
                : "No return request",
          );
          const link = document.createElement("a");
          link.textContent = "View Order Details";
          link.href =
            "orders-returns.html?order=" +
            encodeURIComponent(order.order_number);
          byId("trackingResult").append(link);
          message("trackMessage", "Tracking details loaded.");
        } catch (error) {
          if (run === generation) message("trackMessage", error.message, true);
        } finally {
          if (run === generation) byId("trackButton").disabled = false;
        }
      });
      function loginErrorText(error) {
        if (
          error?.code === "invalid_credentials" ||
          /invalid login credentials/i.test(error?.message || "")
        ) {
          return "Incorrect email or password. Please try again, or use Forgot password.";
        }
        if (error?.code === "email_not_confirmed")
          return "Please confirm your email address before signing in.";
        if (
          error?.status === 429 ||
          /rate limit|too many requests/i.test(error?.message || "")
        ) {
          return "Too many sign-in attempts. Please wait before trying again.";
        }
        return "Unable to sign in right now. Please check your connection and try again.";
      }

      byId("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        byId("loginButton").disabled = true;
        try {
          const { error } = await client.auth.signInWithPassword({
            email: byId("email").value.trim(),
            password: byId("password").value,
          });
          if (error) throw error;
          byId("password").value = "";
          await account();
          message("loginMessage", "Signed in successfully.");
        } catch (error) {
          message("loginMessage", loginErrorText(error), true);
        } finally {
          byId("loginButton").disabled = false;
        }
      });
      client.auth.onAuthStateChange(() => {
        ++generation;
        user = null;
        clearResult();
        byId("trackIdentifier").value = "";
        byId("trackButton").disabled = false;
        setTimeout(account, 0);
      });
      account();
    </script>
    <script src="member-tools.js"></script>
  </body>
</html>
